name: Build HT ScorePath Guard APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'HTScorePathGuard_OneUpload.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unpack source ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f HTScorePathGuard_OneUpload.zip || { echo 'Upload HTScorePathGuard_OneUpload.zip at repository root'; exit 1; }
          unzip -oq HTScorePathGuard_OneUpload.zip
          test -f app/build.gradle
          test -f app/src/main/java/com/htlive/monitor/ScoreGuardEngine.java

      - name: Use Android SDK on GitHub-hosted runner
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$SDK_DIR" || { echo "Android SDK absent: $SDK_DIR"; exit 1; }
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          if [ ! -d "$SDK_DIR/platforms/android-35" ] || [ ! -d "$SDK_DIR/build-tools/35.0.0" ]; then
            SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -type f -name sdkmanager | sort -Vr | head -n1)
            test -n "$SDKMANAGER"
            (yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null) || true
            "$SDKMANAGER" --sdk_root="$SDK_DIR" --install 'platforms;android-35' 'build-tools;35.0.0'
          fi

      - name: Run parser and guard decision tests
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/*.test.js; do node "$test"; done
          mkdir -p /tmp/ht-guard-test
          javac -encoding UTF-8 -d /tmp/ht-guard-test \
            app/src/main/java/com/htlive/monitor/AlertPolicy.java \
            tests/java/com/htlive/monitor/AlertPolicyTest.java
          java -cp /tmp/ht-guard-test com.htlive.monitor.AlertPolicyTest
          javac -encoding UTF-8 -d /tmp/ht-guard-test \
            tests/java/org/json/JSONObject.java \
            tests/java/org/json/JSONArray.java \
            app/src/main/java/com/htlive/monitor/MainScoreRiskEngine.java \
            app/src/main/java/com/htlive/monitor/ScoreGuardEngine.java \
            tests/java/com/htlive/monitor/MainScoreRiskEngineTest.java \
            tests/java/com/htlive/monitor/ScoreGuardEngineTest.java \
            tests/java/com/htlive/monitor/ScorePathTest.java
          java -cp /tmp/ht-guard-test com.htlive.monitor.MainScoreRiskEngineTest
          java -cp /tmp/ht-guard-test com.htlive.monitor.ScoreGuardEngineTest
          java -cp /tmp/ht-guard-test com.htlive.monitor.ScorePathTest

      - name: Build Android debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: HTScorePathGuard-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
